<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ed" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="记录班次工时、排班计划、打卡计时与工资结算：支持分段加班计薪、轮班表、奖金扣款、实际到账、收入预测、年度复盘和工资条导出，数据存在本机，离线可用。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="工时账本" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>工时账本 · 班次与收入记录</title>
    <script>
      try {
        var saved = JSON.parse(
          localStorage.getItem('shift-ledger.preferences.v2') ||
            localStorage.getItem('shift-ledger.preferences.v1') ||
            '{}',
        );
        var dark =
          saved.theme === 'dark' ||
          (saved.theme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', dark ? '#101613' : '#f6f3ed');
      } catch (error) {}
    </script>
    <style>
      html,
      body {
        background: #f6f3ed;
      }

      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #101613;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
